name: Release

# Packs and pushes TestingBot.Tunnel to NuGet when a version tag such as v1.0.0 is pushed.
# Needs the NUGET_API_KEY secret: an API key from nuget.org scoped to push TestingBot.Tunnel.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test tests/TestingBot.Tunnel.Tests -c Release

      - name: Pack
        run: dotnet pack src/TestingBot.Tunnel -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
